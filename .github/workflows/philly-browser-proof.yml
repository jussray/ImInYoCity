name: Philly Game Browser Proof
on:
  push:
    branches: [main, fix/3d-webgl-verification-20261126]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright Pillow
          python -m playwright install chromium
      - name: Validate standalone web bundle
        run: node scripts/build.mjs
      - name: Check bounded game simulation after slow frames
        run: node tests/verify_timestep.mjs
      - name: Real desktop and mobile-view browser interactions
        run: python tests/verify_game.py
      - name: Served service worker freshness and offline boot
        run: python tests/verify_service_worker.py
      - name: Camera never inside buildings; flight respects building volumes
        run: python tests/verify_camera_clearance.py
      - name: Playable boot when WebGL is missing or fails mid-init
        run: python tests/verify_fallback_boot.py
      - name: Nova dialogue and mission card stay clear of controls (desktop, phone portrait/landscape)
        run: python tests/verify_nova_dialogue.py
      - name: HUD marker, level chip and compass stay clear of HUD and controls
        run: python tests/verify_hud_layout.py
      - name: Cinema View hides HUD, letterboxes, lowers camera and restores cleanly
        run: python tests/verify_cinema_view.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: philly-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
